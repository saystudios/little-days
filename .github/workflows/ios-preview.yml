name: Little Days iOS build check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloud.js'
      - 'cloud-config.js'
      - 'reminders.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/ios-preview.yml'
jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor iOS project
        run: |
          node scripts/prepare-web.mjs
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/little-days-build.log" 2>&1 || {
            echo "Build failed. Relevant compiler errors:"
            grep -n -E '(^|[[:space:]])error:|SwiftCompile|BUILD FAILED|No such module|cannot find' "$RUNNER_TEMP/little-days-build.log" | tail -n 55 || true
            tail -n 70 "$RUNNER_TEMP/little-days-build.log"
            exit 1
          }
          tail -n 12 "$RUNNER_TEMP/little-days-build.log"
      - name: Package simulator app
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/App.app' -type d -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LittleDays-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: little-days-ios-simulator
          path: ${{ runner.temp }}/LittleDays-simulator.zip
          retention-days: 7
