name: Little Days TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version
        required: true
        default: '1.0'
jobs:
  testflight:
    runs-on: macos-26-intel
    timeout-minutes: 65
    env:
      APP_ID: com.saystudios.littledays
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.saystudios.littledays
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      SIGN_DIR: ${{ github.workspace }}/.sign
      PROFILE_NAME: Little Days CI ${{ github.run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      SIGNING_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      SIGNING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the newest Xcode 26 or later
        shell: bash
        run: |
          # App Store Connect only accepts builds made with the iOS 26 SDK or later.
          shopt -s nullglob
          XC=""
          for app in /Applications/Xcode_*.app; do
            v="${app#/Applications/Xcode_}"; v="${v%.app}"
            case "$v" in *[Bb]eta*|*RC*) continue;; esac
            major="${v%%.*}"
            [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 26 ] || continue
            if [ -z "$XC" ] || [ "$(printf '%s\n%s\n' "$best" "$v" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)" = "$v" ]; then XC="$app"; best="$v"; fi
          done
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 or later on this runner. Found: $(echo /Applications/Xcode*.app)"; exit 1; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
      - name: Confirm signing secrets exist
        shell: bash
        run: |
          for key in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!key}" ]; then echo "::error::Missing $key secret"; exit 1; fi
          done
      - name: Prepare Capacitor app
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-web.mjs
          npx cap add ios
          npm run ios:assets
          npx cap sync ios
      - name: Verify iOS bundle (web files and native plugins)
        run: node .github/scripts/verify-ios-bundle.mjs
      - name: Choose signing (saved .p12 or Apple-managed)
        shell: bash
        run: |
          if [ -z "$SIGNING_P12_BASE64" ]; then
            # No .p12 saved: Apple signs at export with its cloud-managed certificate.
            echo "Signing: Apple-managed (cloud) distribution certificate."
            echo "SIGNING_MODE=cloud" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SIGNING_P12_PASSWORD" ]; then echo "::error::Missing APPLE_DISTRIBUTION_P12_PASSWORD secret."; exit 1; fi
          echo "SIGNING_MODE=p12" >> "$GITHUB_ENV"
          SIGN_PATH="$RUNNER_TEMP/apple-signing"
          mkdir -p "$SIGN_PATH"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$SIGN_PATH/distribution.p12"
          # Read the certificate (older .p12 exports need -legacy on OpenSSL 3).
          p12_cert() { openssl pkcs12 -in "$SIGN_PATH/distribution.p12" -passin env:SIGNING_P12_PASSWORD -nokeys -clcerts "$@" 2>/dev/null; }
          CERT_PEM="$(p12_cert || p12_cert -legacy)" || true
          if [ -z "$CERT_PEM" ]; then echo "::error::Couldn't open the .p12 certificate. Check APPLE_DISTRIBUTION_P12_BASE64 and APPLE_DISTRIBUTION_P12_PASSWORD."; exit 1; fi
          if [ -n "$SIGNING_PROFILE_BASE64" ]; then
            printf '%s' "$SIGNING_PROFILE_BASE64" | base64 --decode > "$SIGN_PATH/app.mobileprovision"
          else
            # No profile secret: get one from App Store Connect for the same certificate.
            CERT_SERIAL="$(printf '%s\n' "$CERT_PEM" | openssl x509 -noout -serial)" \
              OUT="$SIGN_PATH/app.mobileprovision" node .github/scripts/app-store-profile.mjs
          fi
          security cms -D -i "$SIGN_PATH/app.mobileprovision" > "$SIGN_PATH/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_PATH/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SIGN_PATH/profile.plist")
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          KEYCHAIN_PATH="$SIGN_PATH/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$SIGN_PATH/distribution.p12" -k "$KEYCHAIN_PATH" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGN_PATH/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Set iOS signing and version
        shell: bash
        run: |
          ruby -e "require 'xcodeproj'" || gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          p = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          p.targets.find { |t| t.name == 'App' }.build_configurations.each do |c|
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('APP_ID')
            c.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
            if ENV['SIGNING_MODE'] == 'cloud'
              c.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              c.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            else
              c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
            end
            c.build_settings['MARKETING_VERSION'] = ENV.fetch('VERSION')
            c.build_settings['CURRENT_PROJECT_VERSION'] = ENV.fetch('BUILD_NUMBER')
          end
          p.save
          RUBY
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Camera and photo access text
        shell: bash
        run: |
          # "Scan a flyer or screenshot" lets parents take or pick a photo. iOS
          # requires these explanations or the app closes when the camera opens.
          P=ios/App/App/Info.plist
          set_text() { plutil -replace "$1" -string "$2" "$P"; }
          set_text NSCameraUsageDescription "Little Days uses the camera when you scan a flyer, schedule or invitation to add its activities."
          set_text NSPhotoLibraryUsageDescription "Little Days opens your photos when you choose a screenshot or picture to scan for activities."
      - name: Declare export compliance
        shell: bash
        run: |
          # Little Days only uses standard HTTPS (exempt encryption), so App Store
          # Connect doesn't need to ask about encryption on every build.
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' ios/App/App/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' ios/App/App/Info.plist
      - name: Archive iOS app
        shell: bash
        run: |
          set -o pipefail
          EXTRA=()
          # Apple-managed signing: archive unsigned (so no development certificate is
          # created on this runner); the app is signed for the App Store at export.
          if [ "$SIGNING_MODE" = cloud ]; then EXTRA=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""); fi
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LittleDays.xcarchive" archive "${EXTRA[@]}" > "$RUNNER_TEMP/archive.log" 2>&1 || {
            grep -E 'error:|ARCHIVE FAILED|No such module' "$RUNNER_TEMP/archive.log" | tail -n 35 || true
            tail -n 65 "$RUNNER_TEMP/archive.log"
            exit 1
          }
      - name: Upload archive to TestFlight
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" || { echo "::error::ASC_KEY_P8 must be the full contents of the AuthKey .p8 file, including the BEGIN/END lines."; exit 1; }
          if [ "$SIGNING_MODE" = cloud ]; then
            SIGNING_OPTS="<key>signingStyle</key><string>automatic</string>"
            ALLOW=(-allowProvisioningUpdates)
          else
            SIGNING_OPTS="<key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>$APP_ID</key><string>$PROFILE_NAME</string></dict>"
            ALLOW=()
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          $SIGNING_OPTS
          <key>teamID</key><string>$TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive "${ALLOW[@]}" -archivePath "$RUNNER_TEMP/LittleDays.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
            # Surface Apple's reasons as annotations so they show on the run summary.
            grep -iE 'error|fail|not |no |requires|denied|cannot|could' "$RUNNER_TEMP/export.log" | grep -v '^\s*$' | sort -u | head -n 8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
      - name: Clean up temporary signing files
        if: always()
        shell: bash
        run: |
          export KEYFILE="$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/apple-signing"
