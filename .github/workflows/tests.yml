name: Little Days tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Planner logic tests (several time zones)
        run: npm test
      - name: Check page scripts parse
        run: |
          for f in planner-core.js reminders-core.js native.js kids-core.js sync-core.js item-sync.js app.js kids.js lists.js cloud.js reminders.js sw.js; do node --check "$f"; done
          node -e "const s=require('fs').readFileSync('index.html','utf8');const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)];if(!m.length)throw Error('inline script missing');m.forEach(x=>new Function(x[1]));console.log('inline script OK')"
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schema, migrations and security tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/run.sh
