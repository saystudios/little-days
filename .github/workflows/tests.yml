name: Little Days tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Planner logic tests (several time zones)
        run: npm test
      - name: Check page scripts parse
        run: |
          for f in theme-init.js planner-core.js reminders-core.js native.js kids-core.js sync-core.js meals-sync-core.js item-sync.js app.js kids.js lists.js cloud.js reminders.js scan-core.js scan.js sports-meals.js family-upgrades.js sw.js; do node --check "$f"; done
          node -e "const s=require('fs').readFileSync('index.html','utf8');if(/<script(?![^>]*\ssrc=)[^>]*>/.test(s))throw Error('inline <script> in index.html: the website security policy blocks it; use a file');console.log('no inline scripts')"
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Schema, migrations and security tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/run.sh
